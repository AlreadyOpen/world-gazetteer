# Mirror the current PlaceDB release to Kaggle (archive.py, one dataset per release) and its map files to Hugging Face
# (publish.py), weekly. A run whose release is already published stops after the first request.
# Each run commits status/last-run.json: GitHub turns schedules off after 60 days with no commits.
name: bake
on:
  schedule:
    - cron: '0 22 * * 4'           # Thursdays 22:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the publish gate finds a count drop (a real drop, checked by hand)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: bake
  cancel-in-progress: false
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      PIPELINE_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get update -q
      # tippecanoe 2.79.0 from source, as world-airports: apt's 2.49 drops features
      - id: tip
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: /opt/tippecanoe
          key: tippecanoe-2.79.0-ubuntu-24.04
      - if: steps.tip.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -q libsqlite3-dev zlib1g-dev
          git clone -q https://github.com/felt/tippecanoe /tmp/tip && git -C /tmp/tip checkout -q 68ab8dcc229f95b8b25877697d5e8d66783af503
          make -C /tmp/tip -j"$(nproc)" PREFIX=/opt/tippecanoe && sudo make -C /tmp/tip install PREFIX=/opt/tippecanoe
      - run: echo /opt/tippecanoe/bin >> "$GITHUB_PATH"
      # no download cache: a release is about 2.5 GB, and a run with no new release downloads nothing
      - name: bake
        id: bake
        run: set -o pipefail; mkdir -p status && python bake.py | tee status/last-run.json
      # the release is about 2.5 GB, held three times over (mirror, Kaggle upload, the download that verifies it): make room
      - if: steps.bake.outputs.skip != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h "$GITHUB_WORKSPACE"
      # Kaggle first and not allowed to fail: HF replaces the previous release only once Kaggle holds this one, verified
      - name: archive to Kaggle
        if: steps.bake.outputs.skip != 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PUBLISH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: python archive.py
      - name: publish
        if: steps.bake.outputs.skip != 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBLISH_FORCE: ${{ inputs.force && '1' || '0' }}
        run: set -o pipefail; python publish.py | tee status/last-run.json
      # the small, versioned index of releases (Helen's account). Its own step, allowed to fail.
      - name: index to Kaggle
        if: steps.bake.outputs.skip != 'true'
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          python kaggle_mirror.py helenkwok/world-gazetteer "AlreadyOpen: world gazetteer" data/out releases.json index.json manifest.json
      - name: keep-alive commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/last-run.json
          git commit -m "bake $(date -u +%F)" || exit 0
          git pull --rebase -q && git push   # main may have moved during the run
